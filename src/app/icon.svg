<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8EC"/>
      <stop offset="55%" stop-color="#009dbd"/>
      <stop offset="100%" stop-color="#0A3366"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A3366" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#clinicGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- Medical Cross Badge in Crisp White -->
  <g filter="url(#glow)">
    <!-- Horizontal Cross Bar -->
    <rect x="116" y="211" width="280" height="90" rx="45" fill="#FFFFFF"/>
    <!-- Vertical Cross Bar -->
    <rect x="211" y="116" width="90" height="280" rx="45" fill="#FFFFFF"/>

    <!-- Center Heart Emblem in Radiant Clinic Cyan -->
    <path d="M256 310 C256 310, 196 264, 196 226 C196 206, 212 190, 232 190 C244 190, 252 196, 256 204 C260 196, 268 190, 280 190 C300 190, 316 206, 316 226 C316 264, 256 310, 256 310 Z" fill="#00BDE0"/>

    <!-- Stylized Heartbeat Line inside Heart -->
    <path d="M228 226 H242 L248 214 L256 238 L264 220 L270 226 H284" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
